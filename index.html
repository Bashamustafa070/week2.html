<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>My Budget Tracker</h1>
  <p>500$ week.</p>
  <p><img src="https://cookingformysoul.com/wp-content/uploads/2023/05/feat-spatchcock-bbq-chicken-min.jpg" alt="one" srcset="deluciuos"></p>
  

  <!-- Add Expense Section -->
  <section id="add-expense">
    <h2>Add Expense</h2>
    <label for="expense-name">Expense Name:</label>
    <input type="text" id="expense-name" placeholder="chicken">

    <label for="expense-amount">Amount:</label>
    <input type="number" id="expense-amount" placeholder="500">

    <label for="expense-category">Category:</label>
    <input type="text" id="expense-category" placeholder="meat">
  </section>

  <!-- Your Expenses Section -->
  <section id="your-expenses">
    <h2>Your Expenses</h2>
    <p>chicken</p>
  </section>
</body>
</html>
